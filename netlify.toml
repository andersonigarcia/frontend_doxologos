# Netlify Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"

# Configuração de Scheduled Functions (Nativo do Netlify)
# Não precisa de plugin! O Netlify suporta nativamente desde 2023
# Documentação: https://docs.netlify.com/functions/scheduled-functions/

# A função será executada automaticamente baseado no schedule definido
# no próprio arquivo da função usando a sintaxe:
# export const config = { schedule: "@hourly" }

# Configurações de ambiente (definir no Netlify UI)
# VITE_SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# SMTP_HOST
# SMTP_PORT
# SMTP_USER
# SMTP_PASS
# SMTP_FROM_NAME
# SMTP_FROM_EMAIL

# Redirects e Headers
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Política de cache agressiva para arquivos estáticos (build do Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Política de cache para imagens (SVGs, PNGs, etc da pasta public)
[[headers]]
  for = "/**/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[edge_functions]]
  path = "/artigos/*"
  function = "og-injector"

